name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1' # Check for new Garage releases every Monday at 1:30 AM UTC

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should_push: ${{ steps.decide.outputs.should_push }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: "Decide" below diffs against an arbitrary past commit.
          fetch-depth: 0

      # Garage publishes betas/rcs/internal builds as regular tags, so
      # "latest tag" isn't reliable. Only consider clean vX.Y.Z tags from the
      # Docker Hub image we actually pin in the Dockerfile.
      - name: Determine latest stable Garage version
        id: garage
        run: |
          url="https://hub.docker.com/v2/repositories/dxflrs/garage/tags?page_size=100"
          tags=""
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -fsSL "$url")
            tags="$tags $(echo "$page" | jq -r '.results[].name')"
            url=$(echo "$page" | jq -r '.next')
          done
          version=$(echo "$tags" | tr ' ' '\n' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "Could not determine the latest stable Garage version" >&2
            exit 1
          fi
          echo "Latest stable Garage version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip publishing only when both the resolved Garage version and the
      # tracked source files are unchanged since whatever we last published as ":latest".
      - name: Decide whether to publish
        id: decide
        run: |
          set -e
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          garage_version="${{ steps.garage.outputs.version }}"

          last_labels=$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Image.Config.Labels}}' 2>/dev/null || true)

          if [ -z "$last_labels" ] || [ "$last_labels" = "null" ]; then
            echo "No image published yet."
            revision=0
            should_push=true
          else
            last_garage=$(echo "$last_labels" | jq -r '."io.cabane.garage.version" // empty')
            last_version=$(echo "$last_labels" | jq -r '."org.opencontainers.image.version" // empty')
            last_sha=$(echo "$last_labels" | jq -r '."org.opencontainers.image.revision" // empty')
            last_revision="${last_version##*-}"

            if [ "$last_garage" != "$garage_version" ]; then
              echo "Garage version changed: $last_garage -> $garage_version"
              revision=0
              should_push=true
            elif [ -n "$last_sha" ] && git diff --quiet "$last_sha" HEAD -- Dockerfile entrypoint.sh garage.toml 2>/dev/null; then
              echo "Garage version unchanged ($garage_version) and no relevant file changed since $last_sha."
              revision="$last_revision"
              should_push=false
            else
              echo "Relevant files changed since $last_sha (or it couldn't be compared)."
              revision=$((last_revision + 1))
              should_push=true
            fi
          fi

          version="${garage_version}-${revision}"
          echo "Version: $version, should_push: $should_push"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg GARAGE_VERSION=${{ steps.garage.outputs.version }} \
            --build-arg VERSION=${{ steps.decide.outputs.version }} \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t cabane:ci .

      - name: Save image to a tarball
        run: docker save cabane:ci -o cabane.tar

      - uses: actions/upload-artifact@v7
        with:
          name: cabane-image
          path: cabane.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cabane-image

      - name: Load image
        run: docker load -i cabane.tar

      - name: Start container
        run: |
          docker run -d --name cabane -p 3900:3900 -p 3902:3902 \
            -e ADMIN_TOKEN=test-admin-token \
            -e RPC_SECRET=$(openssl rand -hex 32) \
            -e RPC_PUBLIC_ADDR=127.0.0.1:3901 \
            cabane:ci

      - name: Wait for the Admin API to come up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer test-admin-token" http://localhost:3902/v2/GetClusterStatus || true)
            [ "$code" = "200" ] && { echo "ready after ${i}s"; exit 0; }
            sleep 1
          done
          echo "cabane did not become ready in time"
          exit 1

      - name: Admin API rejects requests without the configured token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3902/v2/GetClusterStatus)
          test "$code" = "403"

      - name: Admin API accepts the configured token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer test-admin-token" http://localhost:3902/v2/GetClusterStatus)
          test "$code" = "200"

      - name: S3 API is live
        run: |
          # An anonymous request is rejected (403), which still proves the S3
          # API is up and enforcing auth rather than refusing the connection.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3900/)
          test "$code" = "403"

      - name: Container shuts down cleanly
        run: |
          docker stop -t 15 cabane
          code=$(docker inspect -f '{{.State.ExitCode}}' cabane)
          test "$code" = "0"

      - name: Dump logs on failure
        if: failure()
        run: docker logs cabane || true

  push:
    needs: [build, test]
    if: >
      needs.build.outputs.should_push == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cabane-image

      - name: Load image
        run: docker load -i cabane.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          version="${{ needs.build.outputs.version }}"
          garage_version="${version%-*}"   # v2.4.1-1 -> v2.4.1
          minor="${garage_version%.*}"     # v2.4.1   -> v2.4
          major="${minor%.*}"              # v2.4     -> v2

          for tag in "$version" "$garage_version" "$minor" "$major" latest; do
            docker tag cabane:ci "${image}:${tag}"
            docker push "${image}:${tag}"
          done
